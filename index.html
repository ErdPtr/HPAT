<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Házi projekt atari</title>
    <style>
        body {
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #222;
            margin-bottom: 10px;
            text-decoration: underline;
        }
        #gameContainer {
            position: relative;
        }
        canvas {
            background: #000;
            display: block;
            border: 4px solid #333;
            border-radius: 6px;
        }
        #hud {
            display: flex;
            justify-content: space-between;
            width: 480px;
            font-size: 18px;
            color: #222;
            margin-bottom: 8px;
        }
        #overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 20px;
            border-radius: 4px;
            gap: 12px;
        }
        #overlayText {
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 22px;
        }
        #overlay button {
            padding: 10px 16px;
            font-size: 15px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background: #4caf50;
            color: white;
            min-width: 140px;
        }
        #overlay button:hover {
            background: #45a049;
        }
        #levelButtons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 430px;
            max-height: 520px;
            overflow-y: auto;
            padding: 4px 8px;
            box-sizing: border-box;
            grid-auto-rows: 38px;
            align-content: start;
        }
        #levelButtons button {
            min-width: 0;
            padding: 9px 4px;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #overlay button.menuBtn {
            font-size: 20px;
            padding: 14px 20px;
            min-width: 220px;
        }
        #overlay button.menuBtn#selectButton {
            background: #3b6ea8;
        }
        #overlay button.menuBtn#selectButton:hover {
            background: #335f91;
        }
        #backButton {
            background: #666 !important;
        }
        #overlay.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <h1>Házi Project Atari</h1>
    <div id="hud">
        <span>Score: <span id="scoreDisplay">0</span></span>
        <span>Level: <span id="levelDisplay">1</span></span>
        <span>Lives: <span id="livesDisplay">3</span></span>
    </div>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="480" height="700"></canvas>
        <div id="overlay">
            <div id="overlayText">Házi Project Atari</div>
            <button id="playButton" class="menuBtn">▶ Játék</button>
            <button id="selectButton" class="menuBtn">Pályaválasztó</button>
            <div id="levelButtons"></div>
            <button id="backButton" style="display:none;">← Vissza</button>
            <button id="overlayButton" style="display:none;">Restart</button>
            <button id="overlayButton2" style="display:none;">Pályaválasztó</button>
        </div>
    </div>
    <label style="margin-top:10px;color:#222;font-size:14px;">
        <input type="checkbox" id="launchCheck"> Kattintásra / Space-re induló labda
    </label>
    <div style="margin-top:4px;color:#555;font-size:13px;">P vagy Space: szünet</div>
    <script>
        (function () {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const levelDisplay = document.getElementById('levelDisplay');
            const livesDisplay = document.getElementById('livesDisplay');
            const overlay = document.getElementById('overlay');
            const overlayText = document.getElementById('overlayText');
            const overlayButton = document.getElementById('overlayButton');
            const levelButtons = document.getElementById('levelButtons');
            const overlayButton2 = document.getElementById('overlayButton2');
            const playButton = document.getElementById('playButton');
            const selectButton = document.getElementById('selectButton');
            const backButton = document.getElementById('backButton');
            const launchCheck = document.getElementById('launchCheck');
            launchCheck.addEventListener('change', () => launchCheck.blur());

            const WIDTH = canvas.width;
            const HEIGHT = canvas.height;

            // ================= BEÁLLÍTÁSOK =================
            const BALL_SPEED = 5;          // px / frame (60 FPS-nél) – minden pályán ugyanaz
            const BALL_RADIUS = 6;
            const MAX_BALLS = 12;
            const DROP_CHANCE = 0.12;      // 12% esély power-up-ra tégla törésekor
            const POWERUP_FALL_SPEED = 2.4;
            const EFFECT_DURATION = 600;   // frame (~10 mp)
            const LAUNCH_DELAY = 50;       // kis szünet életvesztés / indulás után

            const basePaddleWidth = 75;
            const paddle = {
                width: basePaddleWidth,
                height: 10,
                x: (WIDTH - basePaddleWidth) / 2,
                speed: 10
            };
            const paddleTop = HEIGHT - paddle.height - 5;

            // --- Tégla-terület: ez a rész mindig teljesen lefedve indul ---
            const brickAreaX = 20;
            const brickAreaY = 40;
            const brickAreaWidth = WIDTH - brickAreaX * 2;   // 440
            const brickAreaHeight = brickAreaWidth;          // négyzet alakú terület a képhez
            const brickGap = 6;

            let brickRowCount, brickColumnCount, brickWidth, brickHeight;
            let rowOffsets = [];   // mozgó sorok eltolása (px)
            let rowSpeeds = [];    // mozgó sorok sebessége (px / frame)
            let patrols = [];      // mozgó, törhetetlen sávok a tégla-terület alatt
            let colOffsets = [];   // mozgó oszlopok eltolása (px)
            let colSpeeds = [];
            let ghostClock = 0;    // szellem-téglák órája
            let fx = [];           // robbanás-effektek
            const GHOST_PERIOD = 240;  // ennyi frame-enként vált a szellem-fázis

            // ================= KÉPEK =================
            // Pályánként egy háttérkép, ami a téglák mögött bújik meg.
            // A képek a temp_img mappában vannak (kep1 ... kep50); a kiterjesztések lent az 'imageExt' táblában.
            function loadImage(src) {
                const obj = { img: new Image(), loaded: false, src: src };
                obj.img.onload = function () { obj.loaded = true; };
                obj.img.onerror = function () {
                    console.warn('Kép nem található (helyőrző marad):', src);
                };
                obj.img.src = src;
                return obj;
            }

            // ================= PÁLYÁK =================
            // rows/cols      : téglák száma
            // colors         : sorok színei
            // image          : háttérkép útvonala
            // solid(r,c)     : (opcionális) true -> törhetetlen tégla (nem számít a pálya teljesítéséhez)
            // hits(r,c)      : (opcionális) hány találat kell a tégla töréséhez (szám látszik rajta)
            // rowSpeed(r)    : (opcionális) sor oldalirányú mozgása px/frame (körbefordul)
            // patrols        : (opcionális) mozgó törhetetlen sávok a tégla-terület alatt
            const levels = [
                {
                    name: 'Klasszikus',
                    rows: 4, cols: 7,
                    colors: ['#e63946', '#f4a261', '#e9c46a', '#2a9d8f'],
                    image: 'temp_img/kep1.jpg'
                },
                {
                    name: 'Sűrű',
                    rows: 6, cols: 10,
                    colors: ['#8e44ad', '#3498db', '#1abc9c', '#f1c40f', '#e67e22', '#16a085'],
                    image: 'temp_img/kep2.png', hits: (r) => (r === 0 ? 2 : 1)
                },
                {
                    name: 'Tömör',
                    rows: 8, cols: 13,
                    colors: ['#e76f51', '#2a9d8f', '#264653', '#e9c46a', '#8e44ad', '#3498db', '#c0392b', '#16a085'],
                    image: 'temp_img/kep3.png', hits: (r) => (r < 2 ? 2 : 1)
                },
                {
                    name: 'Oszlopok',
                    rows: 8, cols: 11,
                    colors: ['#ef476f', '#ffd166', '#06d6a0', '#118ab2', '#073b4b', '#ef476f', '#ffd166', '#06d6a0'],
                    image: 'temp_img/kep4.png', hits: (r) => (r <= 1 ? 2 : 1),
                    solid: (r, c) => r >= 1 && r <= 5 && c % 4 === 1
                },
                {
                    name: 'Rombusz',
                    rows: 9, cols: 9,
                    colors: ['#f72585', '#b5179e', '#7209b7', '#560bad', '#480ca8', '#3a0ca3', '#3f37c9', '#4361ee', '#4895ef'],
                    image: 'temp_img/kep5.png', hits: (r, c) => (r >= 3 && r <= 5 && c >= 3 && c <= 5 ? 3 : 1),
                    solid: (r, c) => (r === c || r + c === 8) && r >= 2 && r <= 6
                },
                {
                    name: 'Futószalag',
                    rows: 8, cols: 12,
                    colors: ['#ff6b6b', '#feca57', '#48dbfb', '#1dd1a1', '#ff9ff3', '#54a0ff', '#5f27cd', '#ee5253'],
                    image: 'temp_img/kep6.png', hits: (r) => (r === 3 || r === 4 ? 2 : 1),
                    rowSpeed: (r) => (r % 2 === 0 ? 0.7 : -0.7)
                },
                {
                    name: 'Erőd',
                    rows: 10, cols: 13,
                    colors: ['#264653', '#2a9d8f', '#e9c46a', '#f4a261', '#e76f51', '#264653', '#2a9d8f', '#e9c46a', '#f4a261', '#e76f51'],
                    image: 'temp_img/kep7.png', hits: (r, c) => (r >= 4 && r <= 5 && c >= 4 && c <= 8 ? 3 : 1),
                    solid: (r, c) => {
                        // üreges keret, alul 1 tégla nyílással (c = 6)
                        const frameH = (r === 3 || r === 6) && c >= 3 && c <= 9;
                        const frameV = (c === 3 || c === 9) && r >= 3 && r <= 6;
                        return (frameH || frameV) && !(r === 6 && c === 6);
                    }
                },
                {
                    name: 'Akadálypálya',
                    rows: 7, cols: 10,
                    colors: ['#ff595e', '#ffca3a', '#8ac926', '#1982c4', '#6a4c93', '#ff595e', '#ffca3a'],
                    image: 'temp_img/kep8.png', hits: (r) => (r === 0 ? 3 : 1),
                    solid: (r, c) => r === 3 && (c === 2 || c === 7),
                    patrols: [
                        { x: 60, y: 520, w: 90, vx: 1.6 },
                        { x: 300, y: 575, w: 70, vx: -2.1 }
                    ]
                },
                {
                    name: 'Cikcakk',
                    rows: 10, cols: 14,
                    colors: ['#f94144', '#f3722c', '#f8961e', '#f9c74f', '#90be6d', '#43aa8b', '#4d908e', '#577590', '#277da1', '#6a4c93'],
                    image: 'temp_img/kep9.png', hits: (r) => (r % 4 === 0 ? 2 : 1),
                    solid: (r, c) => (r === 4 || r === 5) && c % 5 === 0,
                    rowSpeed: (r) => [0.5, -0.8, 1.0, -0.6, 0.6, -0.6, 0.9, -1.1, 0.7, -0.5][r]
                },
                {
                    name: 'Finálé',
                    rows: 10, cols: 15,
                    colors: ['#03045e', '#023e8a', '#0077b6', '#0096c7', '#00b4d8', '#48cae4', '#90e0ef', '#ade8f4', '#caf0f8', '#e0fbfc'],
                    image: 'temp_img/kep10.png', hits: (r) => (r < 2 ? 3 : r < 4 ? 2 : 1),
                    solid: (r, c) => r >= 2 && r <= 7 && (r + c) % 7 === 0,
                    rowSpeed: (r) => (r % 3 === 2 ? (r % 2 === 0 ? -0.7 : 0.7) : 0),
                    patrols: [
                        { x: 150, y: 565, w: 100, vx: 2.2 }
                    ]
                }
            ];
            // ================= 11–50. PÁLYA =================
            // Új tégla-típusok (a 'type(r,c)' függvényből):
            //   'tnt'   – robbanó tégla: törésekor a környező téglákat is felrobbantja (láncreakció)
            //   'gold'  – arany tégla: törésekor MINDIG power-up-ot ejt
            //   'ghost' – szellem tégla: időnként eltűnik (átjárható), majd visszatér ('phase' = fázis)
            // Új mozgások: colSpeed(c) – oszlopok függőleges körbefordulása;
            // patrols: { x, y, w, h, vx, vy, minY, maxY } – vízszintesen/függőlegesen pattogó sávok.
            const hsl = (h, s, l) => 'hsl(' + h + ',' + s + '%,' + l + '%)';
            const spectrum = (n, h0, h1, s = 75, l = 55) =>
                Array.from({ length: n }, (_, i) => hsl(Math.round(h0 + (h1 - h0) * i / Math.max(1, n - 1)), s, l));
            const nx = (c, C) => (c - (C - 1) / 2) / (C / 2);
            const ny = (r, R) => (r - (R - 1) / 2) / (R / 2);
            const ringOf = (r, c, R, C) => Math.min(r, c, R - 1 - r, C - 1 - c);
            const hash = (r, c, seed) => {
                let h = (Math.imul(r + 1, 73856093) ^ Math.imul(c + 1, 19349663) ^ Math.imul(seed, 83492791)) >>> 0;
                h = Math.imul(h ^ (h >>> 13), 0x5bd1e995) >>> 0;
                return (h ^ (h >>> 15)) >>> 0;
            };
            // Kézzel rajzolt pálya: '#' törhetetlen, '1'-'9' találatszám, 'T' TNT, 'G' arany, 'g' szellem, '.' sima
            function fromMap(name, map, o) {
                return Object.assign({
                    name, rows: map.length, cols: map[0].length,
                    solid: (r, c) => map[r][c] === '#',
                    hits: (r, c) => { const ch = map[r][c]; return ch >= '1' && ch <= '9' ? +ch : 1; },
                    type: (r, c) => ({ T: 'tnt', G: 'gold', g: 'ghost' })[map[r][c]]
                }, o);
            }
            const heart11 = (r, c) => {
                const x = nx(c, 11) * 1.35, y = -ny(r, 11) * 1.35 + 0.2;
                const a = x * x + y * y - 1;
                return a * a * a - x * x * y * y * y <= 0;
            };
            const dist12 = (r, c) => Math.hypot(nx(c, 12), ny(r, 12));

            levels.push(
                // 11
                { name: 'Szellemsakk', rows: 8, cols: 10, colors: spectrum(8, 170, 300),
                  type: (r, c) => ((r + c) % 2 === 0 ? 'ghost' : undefined), phase: (r) => r % 2 },
                // 12
                { name: 'Dinamit', rows: 9, cols: 11, colors: spectrum(9, 0, 55, 85, 55),
                  type: (r, c) => (r % 3 === 1 && (c % 4 === 1 || c % 4 === 2) ? 'tnt' : undefined) },
                // 13
                { name: 'Aranyláz', rows: 9, cols: 11, colors: spectrum(9, 35, 55, 90, 52),
                  type: (r, c) => ((r + 2 * c) % 13 === 0 ? 'gold' : undefined),
                  hits: (r) => (r < 2 ? 2 : 1), rowSpeed: (r) => (r % 2 ? 0.35 : -0.35) },
                // 14
                { name: 'Piramis', rows: 9, cols: 13, colors: spectrum(9, 20, 60, 80, 52),
                  solid: (r, c) => r >= 1 && r <= 6 && (c === 6 - r || c === 6 + r),
                  hits: (r, c) => (r <= 6 && Math.abs(c - 6) < r ? 2 : 1) },
                // 15
                { name: 'Gyűrűk', rows: 11, cols: 11, colors: spectrum(11, 190, 320),
                  solid: (r, c) => {
                      const k = ringOf(r, c, 11, 11);
                      const gapV = c >= 4 && c <= 6, gapH = r >= 4 && r <= 6;
                      return (k === 1 && !((r === 1 || r === 9) && gapV)) || (k === 3 && !((c === 3 || c === 7) && gapH));
                  },
                  type: (r, c) => (r === 5 && c === 5 ? 'gold' : undefined),
                  hits: (r, c) => (ringOf(r, c, 11, 11) === 4 ? 2 : 1) },
                // 16
                { name: 'Lift', rows: 8, cols: 12, colors: spectrum(8, 80, 200),
                  colSpeed: (c) => (c % 2 ? -0.6 : 0.6) * (1 + (c % 3) * 0.2),
                  type: (r, c) => (r === 3 && c % 5 === 2 ? 'gold' : undefined),
                  hits: (r) => (r === 7 ? 2 : 1) },
                // 17
                { name: 'Hullám', rows: 9, cols: 14, colors: spectrum(9, 195, 265),
                  rowSpeed: (r) => Math.sin(r * 0.9 + 1) * 1.1,
                  solid: (r, c) => r === 4 && c % 5 === 2 },
                // 18
                { name: 'Szív', rows: 11, cols: 11, colors: spectrum(11, 340, 370, 80, 55),
                  hits: (r, c) => (heart11(r, c) ? 2 : 1),
                  type: (r, c) => (r === 4 && (c === 3 || c === 7) ? 'gold' : undefined) },
                // 19
                { name: 'Kerítés', rows: 8, cols: 12, colors: spectrum(8, 20, 200, 70, 55),
                  solid: (r, c) => r >= 2 && r <= 5 && c % 3 === 1,
                  patrols: [{ x: 60, y: 540, w: 80, vx: 1.8 }] },
                // 20
                { name: 'Bombázó', rows: 10, cols: 12, colors: spectrum(10, 0, 40, 85, 50),
                  type: (r, c) => (r % 4 === 1 && (c % 4 === 1 || c % 4 === 2) ? 'tnt' : undefined),
                  hits: (r) => (r === 0 ? 2 : 1),
                  patrols: [{ x: 200, y: 505, w: 14, h: 90, vx: 1.5, vy: 0.9, minY: 500, maxY: 580 }] },
                // 21
                { name: 'Villanás', rows: 9, cols: 12, colors: spectrum(9, 260, 330),
                  type: (r, c) => (c % 2 === 0 ? 'ghost' : undefined), phase: (r, c) => (c >> 1) % 2,
                  rowSpeed: (r) => (r % 2 ? 0.4 : -0.4) },
                // 22
                { name: 'Kereszt', rows: 11, cols: 11, colors: spectrum(11, 140, 260),
                  solid: (r, c) => (r === 5 && c >= 1 && c <= 9 && c !== 5 && c !== 4) || (c === 5 && r >= 1 && r <= 9 && r !== 5),
                  type: (r, c) => (r === 5 && c === 5 ? 'gold' : undefined),
                  hits: (r, c) => (Math.abs(r - 5) <= 2 && Math.abs(c - 5) <= 2 ? 2 : 1) },
                // 23
                { name: 'Kígyó', rows: 10, cols: 13, colors: spectrum(10, 120, 330, 70, 52),
                  solid: (r, c) => (r === 2 && c <= 11) || (r === 5 && c >= 1) || (r === 8 && c <= 11),
                  hits: (r) => (r === 0 ? 2 : 1) },
                // 24
                { name: 'Pásztázó', rows: 8, cols: 11, colors: spectrum(8, 300, 380),
                  type: (r, c) => (r === 0 && c % 5 === 2 ? 'gold' : undefined),
                  hits: (r) => (r < 2 ? 2 : 1),
                  patrols: [
                      { x: 30, y: 495, w: 120, vx: 1.2, vy: 1.0, minY: 490, maxY: 620 },
                      { x: 330, y: 620, w: 100, vx: -1.5, vy: -1.1, minY: 490, maxY: 620 }
                  ] },
                // 25
                { name: 'Sakktábla', rows: 12, cols: 12, colors: ['#ecf0f1', '#34495e'],
                  solid: (r, c) => (r < 2 || r > 9) && (c < 2 || c > 9),
                  type: (r, c) => ((r === 5 || r === 6) && (c === 5 || c === 6) ? 'tnt' : undefined),
                  hits: (r, c) => ((r + c) % 2 ? 2 : 1) },
                // 26
                { name: 'Labirintus', rows: 12, cols: 14, colors: spectrum(12, 40, 200),
                  solid: (r, c) => (r === 3 && c >= 3) || (r === 6 && c <= 10) || (r === 9 && c >= 3),
                  hits: (r) => (r === 0 || r === 11 ? 2 : 1) },
                // 27
                { name: 'Turbina', rows: 10, cols: 10, colors: spectrum(10, 10, 70),
                  rowSpeed: (r) => (r % 2 ? 1 : -1) * (0.5 + r * 0.1),
                  solid: (r, c) => r === 4 && c % 3 === 0,
                  hits: (r, c) => ((r + c) % 5 === 0 ? 2 : 1) },
                // 28
                { name: 'Tölcsér', rows: 11, cols: 11, colors: spectrum(11, 200, 280),
                  solid: (r, c) => r >= 2 && r <= 6 && (c === r - 2 || c === 12 - r),
                  hits: (r, c) => (r >= 3 && r <= 6 && c > r - 2 && c < 12 - r ? 2 : 1),
                  type: (r, c) => (r === 8 && c === 5 ? 'gold' : undefined) },
                // 29
                { name: 'Céltábla', rows: 12, cols: 12, colors: spectrum(12, 0, 60),
                  solid: (r, c) => dist12(r, c) > 1.08,
                  type: (r, c) => { const v = dist12(r, c); return v < 0.25 ? 'gold' : (v > 0.5 && v < 0.68 ? 'tnt' : undefined); },
                  hits: (r, c) => (dist12(r, c) < 0.45 ? 2 : 1) },
                // 30
                { name: 'Mérföldkő', rows: 12, cols: 15, colors: spectrum(12, 260, 340),
                  solid: (r, c) => (r === 5 || r === 6) && (c === 3 || c === 11),
                  type: (r, c) => (ringOf(r, c, 12, 15) === 0 ? 'ghost' : ((r === 5 || r === 6) && c === 7 ? 'gold' : undefined)),
                  hits: (r, c) => { const k = ringOf(r, c, 12, 15); return k >= 3 ? 3 : (k >= 1 ? 2 : 1); },
                  rowSpeed: (r) => (r % 2 ? 0.5 : -0.5),
                  patrols: [{ x: 140, y: 540, w: 100, vx: 2.0 }] },
                // 31
                { name: 'Szivárvány', rows: 10, cols: 12, colors: spectrum(10, 0, 300, 80, 55),
                  colSpeed: (c) => [0.7, 0.7, 0.7, -0.7, -0.7, -0.7, 0.7, 0.7, 0.7, -0.7, -0.7, -0.7][c],
                  hits: (r) => (r % 3 === 2 ? 2 : 1),
                  type: (r, c) => (r === 9 && c % 4 === 1 ? 'gold' : undefined) },
                // 32
                { name: 'Tüskék', rows: 10, cols: 13, colors: spectrum(10, 300, 360, 70, 52),
                  solid: (r, c) => r % 2 === 1 && c % 2 === 1 && r < 9,
                  rowSpeed: (r) => (r % 2 ? (r % 4 === 1 ? 0.8 : -0.8) : 0),
                  hits: (r) => (r === 0 ? 2 : 1) },
                // 33
                { name: 'Diagonális', rows: 11, cols: 11, colors: spectrum(11, 160, 240),
                  solid: (r, c) => c - r === 3,
                  type: (r, c) => (r - c === 3 ? 'ghost' : undefined),
                  hits: (r, c) => ((r + c) % 4 === 0 ? 2 : 1) },
                // 34
                { name: 'Kapuk', rows: 10, cols: 13, colors: spectrum(10, 30, 170),
                  solid: (r, c) => (r === 4 && c !== 2 && c !== 6 && c !== 10) || (r === 6 && c !== 4 && c !== 8),
                  type: (r, c) => ((r === 4 && (c === 2 || c === 6 || c === 10)) || (r === 6 && (c === 4 || c === 8)) ? 'ghost' : undefined),
                  phase: (r) => (r === 4 ? 0 : 1),

            levels.forEach((l, i) => { l.image = 'temp_img/kep' + (i + 1) + '.' + imageExt[i + 1]; });

            const POWERUPS = {

            // ================= ÁLLAPOT =================
            let balls = [];

            // ================= SEGÉDFÜGGVÉNYEK =================
            const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

            function makeBall(x, y, angleFromVertical) {

            function rotateBall(ball, delta) {

            function keepBallAngleSane(ball) {

            // ================= PÁLYA FELÉPÍTÉSE =================
            function computeBrickGeometry(levelIndex) {
                const level = levels[levelIndex];

                brickColumnCount = level.cols;
                brickWidth = (brickAreaWidth - (brickColumnCount - 1) * brickGap) / brickColumnCount;
                brickHeight = (brickAreaHeight - (brickRowCount - 1) * brickGap) / brickRowCount;
            }

            function buildBricks(levelIndex) {
                const level = levels[levelIndex];
                computeBrickGeometry(levelIndex);
                bricks = [];
                for (let c = 0; c < brickColumnCount; c++) {
                    bricks[c] = [];
                    for (let r = 0; r < brickRowCount; r++) {
                        const isSolid = !!(level.solid && level.solid(r, c));
                        const h = level.hits ? level.hits(r, c) : 1;
                        bricks[c][r] = {
                            status: 1,
                            c, r,
                            solid: isSolid,
                            type: isSolid || !level.type ? undefined : level.type(r, c),
                            phase: level.phase ? level.phase(r, c) : 0,
                            hits: h,
                            maxHits: h,
                            color: level.colors[r % level.colors.length]
                        };
                    }
                }

                // Biztonsági ellenőrzés: minden törhető tégla elérhető legyen.
                // Ami teljesen el van zárva törhetetlen téglák mögé, azt törhetetlenné tesszük,
                // így a pálya mindig teljesíthető marad.
                const reachable = [];
                for (let c = 0; c < brickColumnCount; c++) reachable[c] = new Array(brickRowCount).fill(false);
                const queue = [];
                for (let c = 0; c < brickColumnCount; c++) {
                    for (let r = 0; r < brickRowCount; r++) {
                        const onBorder = r === 0 || r === brickRowCount - 1 || c === 0 || c === brickColumnCount - 1;
                        if (onBorder && !bricks[c][r].solid) {
                            reachable[c][r] = true;
                            queue.push([c, r]);
                        }

                        if (nc < 0 || nr < 0 || nc >= brickColumnCount || nr >= brickRowCount) return;
                        if (bricks[nc][nr].solid || reachable[nc][nr]) return;
                        reachable[nc][nr] = true;
                        queue.push([nc, nr]);

                    for (let r = 0; r < brickRowCount; r++) {
                        if (!bricks[c][r].solid && !reachable[c][r]) bricks[c][r].solid = true;
                    }
                }

                rowOffsets = new Array(brickRowCount).fill(0);
                rowSpeeds = [];
                for (let r = 0; r < brickRowCount; r++) {
                    rowSpeeds[r] = level.rowSpeed ? level.rowSpeed(r) : 0;
                }
                colOffsets = new Array(brickColumnCount).fill(0);
                colSpeeds = [];
                for (let c = 0; c < brickColumnCount; c++) {
                    colSpeeds[c] = level.colSpeed ? level.colSpeed(c) : 0;
                }
                ghostClock = 0;
                fx = [];
                patrols = (level.patrols || []).map(p => ({

                    vx: p.vx || 0, vy: p.vy || 0,
                    minY: p.minY !== undefined ? p.minY : p.y,
                    maxY: p.maxY !== undefined ? p.maxY : p.y
                }));
            }

            // Egy tégla "téglalapjai": mozgó sor/oszlop esetén körbefordul, ezért akár több darab is lehet.
            // A téglalapokat a tégla-területre vágjuk.
            function brickRects(c, r) {
                const cw = brickWidth + brickGap;
                const ch = brickHeight + brickGap;
                const totalW = brickColumnCount * cw;
                const totalH = brickRowCount * ch;
                const x = (((c * cw + rowOffsets[r]) % totalW) + totalW) % totalW;
                const y = (((r * ch + colOffsets[c]) % totalH) + totalH) % totalH;
                const xs = x + brickWidth > brickAreaWidth ? [x, x - totalW] : [x];
                const ys = y + brickHeight > brickAreaHeight ? [y, y - totalH] : [y];
                const out = [];
                for (const px of xs) {
                    const left = Math.max(px + brickAreaX, brickAreaX);
                    const right = Math.min(px + brickAreaX + brickWidth, brickAreaX + brickAreaWidth);
                    if (right <= left + 0.5) continue;
                    for (const py of ys) {
                        const top = Math.max(py + brickAreaY, brickAreaY);
                        const bottom = Math.min(py + brickAreaY + brickHeight, brickAreaY + brickAreaHeight);
                        if (bottom > top + 0.5) out.push({ l: left, r: right, t: top, b: bottom });
                    }
                }
                return out;
            }

            // Szellem-tégla: éppen szilárd-e?
            function ghostSolid(b) {
                return (Math.floor(ghostClock / GHOST_PERIOD) + b.phase) % 2 === 0;
            }

            function bricksRemaining() {
                let count = 0;
                for (let c = 0; c < brickColumnCount; c++) {
                    for (let r = 0; r < brickRowCount; r++) {
                        const b = bricks[c][r];
                        if (b.status === 1 && !b.solid) count++;

            function startLevel(levelIndex, carry) {
                currentLevel = levelIndex;

            // ================= ÜTKÖZÉS =================
            // Kör - téglalap ütközés. Visszatér: true, ha ütközött (és a labdát kitolja/visszaveri).
            function hitRect(ball, l, t, r, b) {
                const R = BALL_RADIUS;
                const cx = clamp(ball.x, l, r);
                const cy = clamp(ball.y, t, b);
                const dx = ball.x - cx;
                const dy = ball.y - cy;
                if (dx * dx + dy * dy >= R * R) return false;

                if (dx === 0 && dy === 0) {
                    // a labda közepe a téglán belül van – a legkisebb behatolás szerint
                    const ol = ball.x - l, or = r - ball.x, ot = ball.y - t, ob = b - ball.y;
                    const m = Math.min(ol, or, ot, ob);
                    if (m === ol) { ball.x = l - R; ball.vx = -Math.abs(ball.vx); }
                    else if (m === or) { ball.x = r + R; ball.vx = Math.abs(ball.vx); }
                    else if (m === ot) { ball.y = t - R; ball.vy = -Math.abs(ball.vy); }
                    else { ball.y = b + R; ball.vy = Math.abs(ball.vy); }
                } else if (Math.abs(dx) > Math.abs(dy)) {
                    ball.vx = dx > 0 ? Math.abs(ball.vx) : -Math.abs(ball.vx);
                    ball.x = dx > 0 ? r + R : l - R;
                } else {
                    ball.vy = dy > 0 ? Math.abs(ball.vy) : -Math.abs(ball.vy);
                    ball.y = dy > 0 ? b + R : t - R;
                }
                keepBallAngleSane(ball);
                return true;
            }

            function registerBrickHit(b, rect) {
                combo++;

                scoreDisplay.textContent = score;
                b.hits--;
                if (b.hits <= 0) destroyBrick(b);
            }

            function brickCenter(b) {
                const rects = brickRects(b.c, b.r);
                if (rects.length) {
                    const rc = rects[0];
                    return { x: (rc.l + rc.r) / 2, y: (rc.t + rc.b) / 2 };
                }
                return { x: brickAreaX + brickAreaWidth / 2, y: brickAreaY + brickAreaHeight / 2 };
            }

            function killBrick(b, queue) {
                b.status = 0;
                const pos = brickCenter(b);
                if (b.type === 'gold' || Math.random() < DROP_CHANCE) {
                    powerUps.push({ x: pos.x, y: pos.y, type: randomPowerUpType() });
                }
                if (b.type === 'tnt') queue.push({ b, x: pos.x, y: pos.y });
            }

            function destroyBrick(b) {
                const queue = [];
                killBrick(b, queue);
                // TNT láncreakció: a közvetlen környezetben (geometriailag) lévő törhető téglák is elpusztulnak
                const reach = Math.max(brickWidth, brickHeight) + brickGap + 2;
                while (queue.length) {
                    const t = queue.shift();
                    fx.push({ x: t.x, y: t.y, t: 0, r: reach * 1.5 });
                    for (let c = 0; c < brickColumnCount; c++) {
                        for (let r = 0; r < brickRowCount; r++) {
                            const nb = bricks[c][r];
                            if (nb.status !== 1 || nb.solid) continue;
                            const pos = brickCenter(nb);
                            if (Math.abs(pos.x - t.x) <= reach && Math.abs(pos.y - t.y) <= reach) {
                                score += 10;

                            }
                        }
                    }
                }
                scoreDisplay.textContent = score;

            function brickCollision(ball) {
                for (let c = 0; c < brickColumnCount; c++) {
                    for (let r = 0; r < brickRowCount; r++) {
                        const b = bricks[c][r];

                        if (b.type === 'ghost' && !b.solid && !ghostSolid(b)) continue; // átjárható fázis
                        const rects = brickRects(c, r);
                        for (const rect of rects) {
                            if (hitRect(ball, rect.l, rect.t, rect.r, rect.b)) {
                                if (!b.solid) registerBrickHit(b, rect);
                                return true; // egy lépésben csak egy találat
                            }
                        }
                    }
                }
                return false;
            }

            function stepBall(ball, dt) {
                const R = BALL_RADIUS;
                const dist = BALL_SPEED * speedFactor * dt;
                const n = Math.max(1, Math.ceil(dist / 3));
                const s = dist / n;

                for (let i = 0; i < n; i++) {
                    ball.x += ball.vx * s;
                    ball.y += ball.vy * s;

                    // Falak
                    if (ball.x < R) { ball.x = R; ball.vx = Math.abs(ball.vx); }
                    else if (ball.x > WIDTH - R) { ball.x = WIDTH - R; ball.vx = -Math.abs(ball.vx); }
                    if (ball.y < R) { ball.y = R; ball.vy = Math.abs(ball.vy); keepBallAngleSane(ball); }

                    // Ütő
                    if (ball.vy > 0 &&
                        ball.y + R >= paddleTop && ball.y < paddleTop + paddle.height &&
                        ball.x >= paddle.x - R * 0.5 && ball.x <= paddle.x + paddle.width + R * 0.5) {
                        const hitPos = clamp((ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2), -1, 1);
                        const angle = hitPos * (Math.PI / 3); // max 60 fok a függőlegestől
                        ball.vx = Math.sin(angle);
                        ball.vy = -Math.cos(angle);
                        ball.y = paddleTop - R;
                        combo = 0;
                    }

                    // Mozgó törhetetlen sávok
                    for (const p of patrols) {
                        hitRect(ball, p.x, p.y, p.x + p.w, p.y + p.h);
                    }

                    // Téglák
                    brickCollision(ball);
                    if (!gameRunning) return;

                    // Elesett
                    if (ball.y - R > HEIGHT) {
                        ball.dead = true;
                        return;
                    }
                }
            }

            // ================= POWER-UP HATÁSOK =================
            function applyPowerUp(type) {
                showToast(POWERUPS[type].text);
                switch (type) {
                    case 'slow':
                        speedFactor = 0.65;
                        speedTimer = EFFECT_DURATION;
                        break;
                    case 'fast':
                        speedFactor = 1.35;
                        speedTimer = EFFECT_DURATION;
                        break;
                    case 'multi': {
                        // 2 extra labda az ütő közepéről
                        const px = paddle.x + paddle.width / 2;
                        [-0.35, 0.35].forEach(a => {
                            if (balls.length < MAX_BALLS) balls.push(makeBall(px, paddleTop - BALL_RADIUS, a));
                        });
                        break;
                    }
                    case 'split': {
                        // minden meglévő labdából még egy
                        const snapshot = balls.slice();
                        snapshot.forEach((b, i) => {
                            if (balls.length >= MAX_BALLS) return;
                            const copy = { x: b.x, y: b.y, vx: b.vx, vy: b.vy, dead: false };
                            rotateBall(copy, (i % 2 === 0 ? 1 : -1) * 0.5);
                            balls.push(copy);
                        });
                        break;
                    }
                    case 'wide':
                        wideTimer = EFFECT_DURATION * 1.2;
                        setPaddleWidth(basePaddleWidth * 1.6);
                        break;
                    case 'life':
                        lives++;
                        livesDisplay.textContent = lives;
                        break;
                }
            }

            // ================= RAJZOLÁS =================
            function drawBackgroundImage() {
                const levelImage = levels[currentLevel].imageObj;
                ctx.save();
                ctx.beginPath();
                ctx.rect(brickAreaX, brickAreaY, brickAreaWidth, brickAreaHeight);
                ctx.clip();
                if (levelImage && levelImage.loaded) {
                    ctx.drawImage(levelImage.img, brickAreaX, brickAreaY, brickAreaWidth, brickAreaHeight);
                } else {
                    // Helyőrző, amíg nincs meg a kép
                    ctx.fillStyle = '#333';
                    ctx.fillRect(brickAreaX, brickAreaY, brickAreaWidth, brickAreaHeight);
                    ctx.fillStyle = '#777';
                    ctx.font = '16px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('Háttérkép helyőrző', brickAreaX + brickAreaWidth / 2, brickAreaY + brickAreaHeight / 2 - 8);
                    ctx.fillText(levels[currentLevel].image, brickAreaX + brickAreaWidth / 2, brickAreaY + brickAreaHeight / 2 + 14);
                }
                ctx.restore();
            }

            function drawSolidBrick(l, t, w, h) {
                ctx.fillStyle = '#7f8c8d';
                ctx.fillRect(l, t, w, h);
                ctx.strokeStyle = '#4a5557';
                ctx.lineWidth = 1;
                ctx.strokeRect(l + 0.5, t + 0.5, w - 1, h - 1);
                ctx.beginPath();
                ctx.moveTo(l + 2, t + 2); ctx.lineTo(l + w - 2, t + h - 2);
                ctx.moveTo(l + w - 2, t + 2); ctx.lineTo(l + 2, t + h - 2);
                ctx.stroke();
            }

            function drawBricks() {
                ctx.save();
                ctx.beginPath();
                ctx.rect(brickAreaX, brickAreaY, brickAreaWidth, brickAreaHeight);
                ctx.clip();
                for (let c = 0; c < brickColumnCount; c++) {
                    for (let r = 0; r < brickRowCount; r++) {
                        const b = bricks[c][r];
                        if (b.status !== 1) continue;
                        brickRects(c, r).forEach(rect => {
                            if (b.solid) {
                                drawSolidBrick(rect.l, rect.t, rect.r - rect.l, rect.b - rect.t);
                            } else {
                                const bw = rect.r - rect.l, bh = rect.b - rect.t;
                                let alpha = 1;
                                if (b.type === 'ghost') {
                                    const tt = ghostClock % GHOST_PERIOD;
                                    const nearSwitch = tt > GHOST_PERIOD - 45;
                                    const flicker = 0.5 + 0.5 * Math.sin(ghostClock * 0.5);
                                    if (ghostSolid(b)) alpha = nearSwitch ? 0.35 + 0.55 * flicker : 0.9;
                                    else alpha = nearSwitch ? 0.12 + 0.3 * flicker : 0.1;
                                }
                                ctx.globalAlpha = alpha;
                                ctx.fillStyle = b.type === 'gold' ? '#f1c40f' : (b.type === 'tnt' ? '#c0392b' : b.color);
                                ctx.fillRect(rect.l, rect.t, bw, bh);
                                if (b.type === 'ghost') {
                                    ctx.save();
                                    ctx.setLineDash([3, 2]);
                                    ctx.lineWidth = 1;
                                    ctx.strokeStyle = '#fff';
                                    ctx.strokeRect(rect.l + 0.5, rect.t + 0.5, bw - 1, bh - 1);
                                    ctx.restore();
                                } else if (b.type === 'gold') {
                                    ctx.lineWidth = 1.5;
                                    ctx.strokeStyle = '#fff6b0';
                                    ctx.strokeRect(rect.l + 1, rect.t + 1, bw - 2, bh - 2);
                                } else if (b.type === 'tnt') {
                                    ctx.fillStyle = 'rgba(0,0,0,0.35)';
                                    ctx.fillRect(rect.l, rect.t + bh * 0.35, bw, bh * 0.3);
                                }
                                if (b.maxHits === 1 && (b.type === 'gold' || b.type === 'tnt') && bw > 12) {
                                    ctx.font = 'bold ' + Math.min(13, Math.floor(bh * 0.6)) + 'px Arial';
                                    ctx.textAlign = 'center';
                                    ctx.textBaseline = 'middle';
                                    ctx.fillStyle = '#fff';
                                    ctx.fillText(b.type === 'gold' ? '★' : (bw >= 22 ? 'TNT' : '!'), (rect.l + rect.r) / 2, (rect.t + rect.b) / 2 + 1);
                                }
                                if (b.maxHits > 1 && rect.r - rect.l > 14) {
                                    ctx.font = 'bold ' + Math.min(15, Math.floor(brickHeight * 0.7)) + 'px Arial';
                                    ctx.textAlign = 'center';
                                    ctx.textBaseline = 'middle';
                                    ctx.lineWidth = 3;
                                    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
                                    ctx.strokeText(b.hits, (rect.l + rect.r) / 2, (rect.t + rect.b) / 2 + 1);
                                    ctx.fillStyle = '#fff';
                                    ctx.fillText(b.hits, (rect.l + rect.r) / 2, (rect.t + rect.b) / 2 + 1);
                                }
                                ctx.globalAlpha = 1;
                            }
                        });
                    }
                }
                ctx.restore();
            }

            function drawFx() {
                fx.forEach(e => {
                    const k = e.t / 22;
                    ctx.beginPath();
                    ctx.arc(e.x, e.y, 6 + e.r * k, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255,170,40,' + (0.5 * (1 - k)) + ')';
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = 'rgba(255,240,150,' + (1 - k) + ')';
                    ctx.stroke();
                });
            }

            function drawPatrols() {
                patrols.forEach(p => drawSolidBrick(p.x, p.y, p.w, p.h));
            }

            function drawPowerUps() {
                powerUps.forEach(p => {
                    const def = POWERUPS[p.type];
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 11, 0, Math.PI * 2);
                    ctx.fillStyle = def.color;
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#fff';
                    ctx.stroke();
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 13px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(def.label, p.x, p.y + 1);
                    ctx.textBaseline = 'alphabetic';
                });
            }

            function drawBalls() {
                balls.forEach(ball => {
                    ctx.beginPath();
                    ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                    ctx.closePath();
                });
            }

            function drawPaddle() {
                ctx.fillStyle = '#00bcd4';
                ctx.fillRect(paddle.x, paddleTop, paddle.width, paddle.height);
            }

            function drawStatus() {
                ctx.font = '13px Arial';
                ctx.textAlign = 'left';
                ctx.fillStyle = '#ddd';
                const parts = [];
                if (speedTimer > 0) parts.push((speedFactor < 1 ? 'Lassú ' : 'Gyors ') + Math.ceil(speedTimer / 60) + 'mp');
                if (wideTimer > 0) parts.push('Széles ' + Math.ceil(wideTimer / 60) + 'mp');
                ctx.fillText(parts.join('  |  '), brickAreaX, 26);
                if (combo >= 2) {
                    ctx.textAlign = 'center';
                    ctx.fillStyle = '#7bed9f';
                    ctx.fillText('Kombó ' + combo + ' (×' + comboMultiplier() + ')', WIDTH / 2, 26);
                }
                if (launchTimer === Infinity) {
                    ctx.textAlign = 'center';
                    ctx.fillStyle = '#fff';
                    ctx.font = '15px Arial';
                    ctx.fillText('Kattints vagy nyomj Space-t az indításhoz', WIDTH / 2, paddleTop - 45);
                }
                if (toast.timer > 0) {
                    ctx.textAlign = 'right';
                    ctx.fillStyle = '#ffd166';
                    ctx.fillText(toast.text, brickAreaX + brickAreaWidth, 26);
                }
            }

            function drawPauseText() {
                ctx.fillStyle = 'rgba(0,0,0,0.55)';
                ctx.fillRect(0, 0, WIDTH, HEIGHT);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 32px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('SZÜNET', WIDTH / 2, HEIGHT / 2);
                ctx.font = '15px Arial';
                ctx.fillText('P vagy Space a folytatáshoz', WIDTH / 2, HEIGHT / 2 + 30);
            }

            function render() {
                ctx.clearRect(0, 0, WIDTH, HEIGHT);
                drawBackgroundImage();
                drawBricks();
                drawPatrols();
                drawFx();
                drawPowerUps();
                drawBalls();
                drawPaddle();
                drawStatus();
            }

            // ================= JÁTÉKMENET =================
            function handleLevelClear() {
                if (currentLevel < levels.length - 1) {
                    pauseAndShowOverlay(
                        'Pálya teljesítve! (' + (currentLevel + 1) + '/' + levels.length + ')',
                        'Következő pálya', () => startGame(currentLevel + 1, true),
                        'Pályaválasztó', () => showLevelSelect()
                    );
                } else {
                    pauseAndShowOverlay('You win! Minden pályát teljesítettél!', 'Főmenü', () => { showMainMenu(); });
                }
            }

            function showMainMenu() {
                gameRunning = false;
                cancelAnimationFrame(animationId);
                overlayText.textContent = 'Házi Project Atari';
                playButton.style.display = 'block';
                selectButton.style.display = 'block';
                backButton.style.display = 'none';
                levelButtons.style.display = 'none';
                overlayButton.style.display = 'none';
                overlayButton2.style.display = 'none';
                overlay.classList.remove('hidden');
            }

            function showLevelSelect() {
                gameRunning = false;
                cancelAnimationFrame(animationId);
                overlayText.textContent = 'Válassz pályát!';
                playButton.style.display = 'none';
                selectButton.style.display = 'none';
                backButton.style.display = 'block';
                levelButtons.style.display = 'grid';
                levelButtons.scrollTop = 0;
                overlayButton.style.display = 'none';
                overlayButton2.style.display = 'none';
                overlay.classList.remove('hidden');
            }

            function pauseAndShowOverlay(text, buttonLabel, onContinue, label2, onSecond) {
                gameRunning = false;
                cancelAnimationFrame(animationId);
                overlayText.textContent = text;
                playButton.style.display = 'none';
                selectButton.style.display = 'none';
                backButton.style.display = 'none';
                levelButtons.style.display = 'none';
                overlayButton.style.display = 'block';
                overlayButton.textContent = buttonLabel;
                if (label2) {
                    overlayButton2.style.display = 'block';
                    overlayButton2.textContent = label2;
                    overlayButton2.onclick = () => {
                        overlay.classList.add('hidden');
                        onSecond();
                    };
                } else {
                    overlayButton2.style.display = 'none';
                }
                overlay.classList.remove('hidden');
                overlayButton.onclick = () => {
                    overlay.classList.add('hidden');
                    onContinue();
                };
            }

            function startGame(levelIndex, carry) {
                overlay.classList.add('hidden');
                startLevel(levelIndex, carry);
                paused = false;
                gameRunning = true;
                lastTs = 0;
                animationId = requestAnimationFrame(loop);
            }

            playButton.addEventListener('click', () => startGame(0));
            selectButton.addEventListener('click', () => showLevelSelect());
            backButton.addEventListener('click', () => showMainMenu());

            // Pályaválasztó gombok dinamikusan
            levels.forEach((level, i) => {
                const btn = document.createElement('button');
                btn.textContent = 'Level ' + (i + 1);
                btn.style.background = 'hsl(' + (130 + Math.floor(i / 10) * 45) + ',45%,36%)';
                btn.addEventListener('click', () => startGame(i));
                levelButtons.appendChild(btn);
            });

            function launchBall() {
                if (launchTimer === Infinity) launchTimer = 0;
            }
            function togglePause() {
                if (gameRunning) paused = !paused;
            }

            function keyDownHandler(e) {
                if (e.key === 'p' || e.key === 'P') {
                    if (!e.repeat) togglePause();
                    return;
                }
                if (e.key === ' ' || e.code === 'Space') {
                    e.preventDefault();
                    if (e.repeat || !gameRunning) return;
                    if (!paused && launchTimer === Infinity) launchBall();
                    else togglePause();
                    return;
                }
                if (e.key === 'Right' || e.key === 'ArrowRight') rightPressed = true;
                else if (e.key === 'Left' || e.key === 'ArrowLeft') leftPressed = true;
            }
            function keyUpHandler(e) {
                if (e.key === 'Right' || e.key === 'ArrowRight') rightPressed = false;
                else if (e.key === 'Left' || e.key === 'ArrowLeft') leftPressed = false;
            }
            function mouseMoveHandler(e) {
                const rect = canvas.getBoundingClientRect();
                const relativeX = e.clientX - rect.left;
                if (relativeX > 0 && relativeX < WIDTH) {
                    paddle.x = clamp(relativeX - paddle.width / 2, 0, WIDTH - paddle.width);
                }
            }

            document.addEventListener('keydown', keyDownHandler, false);
            document.addEventListener('keyup', keyUpHandler, false);
            canvas.addEventListener('mousemove', mouseMoveHandler, false);
            canvas.addEventListener('click', () => { if (gameRunning && !paused) launchBall(); }, false);

            function update(dt) {
                // Időzített hatások
                if (speedTimer > 0) {
                    speedTimer -= dt;
                    if (speedTimer <= 0) { speedTimer = 0; speedFactor = 1; }
                }
                if (wideTimer > 0) {
                    wideTimer -= dt;
                    if (wideTimer <= 0) { wideTimer = 0; setPaddleWidth(basePaddleWidth); }
                }
                if (toast.timer > 0) toast.timer -= dt;

                // Ütő billentyűzettel
                if (rightPressed) paddle.x = Math.min(paddle.x + paddle.speed * dt, WIDTH - paddle.width);
                else if (leftPressed) paddle.x = Math.max(paddle.x - paddle.speed * dt, 0);

                // Mozgó sorok / oszlopok
                for (let r = 0; r < brickRowCount; r++) rowOffsets[r] += rowSpeeds[r] * dt;
                for (let c = 0; c < brickColumnCount; c++) colOffsets[c] += colSpeeds[c] * dt;
                ghostClock += dt;
                for (let i = fx.length - 1; i >= 0; i--) {
                    fx[i].t += dt;
                    if (fx[i].t >= 22) fx.splice(i, 1);
                }

                // Mozgó törhetetlen sávok
                patrols.forEach(p => {
                    p.x += p.vx * dt;
                    if (p.x < 10) { p.x = 10; p.vx = Math.abs(p.vx); }
                    else if (p.x + p.w > WIDTH - 10) { p.x = WIDTH - 10 - p.w; p.vx = -Math.abs(p.vx); }
                    if (p.vy) {
                        p.y += p.vy * dt;
                        if (p.y < p.minY) { p.y = p.minY; p.vy = Math.abs(p.vy); }
                        else if (p.y > p.maxY) { p.y = p.maxY; p.vy = -Math.abs(p.vy); }
                    }
                });

                // Leeső power-upok
                for (let i = powerUps.length - 1; i >= 0; i--) {
                    const p = powerUps[i];
                    p.y += POWERUP_FALL_SPEED * dt;
                    const caught = p.y + 11 >= paddleTop && p.y - 11 <= paddleTop + paddle.height &&
                                   p.x >= paddle.x - 8 && p.x <= paddle.x + paddle.width + 8;
                    if (caught) {
                        powerUps.splice(i, 1);
                        applyPowerUp(p.type);
                    } else if (p.y - 11 > HEIGHT) {
                        powerUps.splice(i, 1);
                    }
                }

                // Labdák
                if (launchTimer === Infinity && !launchCheck.checked) launchTimer = LAUNCH_DELAY;
                if (launchTimer > 0) {
                    launchTimer -= dt;
                    balls.forEach(b => { b.x = paddle.x + paddle.width / 2; });
                } else {
                    for (let i = 0; i < balls.length; i++) {
                        stepBall(balls[i], dt);
                        if (!gameRunning) return;
                    }
                    balls = balls.filter(b => !b.dead);
                }

                if (balls.length === 0) {
                    lives--;
                    livesDisplay.textContent = lives;
                    if (lives <= 0) {
                        pauseAndShowOverlay('Game Over! Final score: ' + score, 'Újra', () => startGame(currentLevel), 'Főmenü', () => showMainMenu());
                    } else {
                        resetBallAndPaddle();
                    }
                }
            }

            function loop(ts) {
                if (!gameRunning) return;
                if (!lastTs) lastTs = ts;
                const dt = Math.min((ts - lastTs) / 16.667, 2.5);
                lastTs = ts;
                if (!paused) update(dt);
                render();
                if (paused) drawPauseText();
                if (gameRunning) animationId = requestAnimationFrame(loop);
            }

            // Induláskor főmenü jelenik meg
            showMainMenu();
        })();
    </script>
</body>
</html>
